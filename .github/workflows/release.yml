name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  NODE_VERSION: '24.22.1'
  PNPM_VERSION: '11.27.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify release tag and package layout
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node - "$RELEASE_TAG" <<'NODE'
          const fs = require('node:fs')

          const tag = process.argv[2]
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`invalid release tag: ${tag}`)
          }
          if (tag !== `v${root.version}`) {
            throw new Error(`tag ${tag} does not match root version ${root.version}`)
          }

          const packages = fs.readdirSync('packages').map((dir) => ({
            dir,
            manifest: JSON.parse(fs.readFileSync(`packages/${dir}/package.json`, 'utf8')),
          }))
          for (const { manifest } of packages) {
            if (manifest.version !== root.version) {
              throw new Error(`${manifest.name}@${manifest.version} does not match ${root.version}`)
            }
          }

          const publicPackages = packages.filter(({ manifest }) => manifest.private !== true)
          const publicNames = publicPackages.map(({ manifest }) => manifest.name).sort()
          const rootNames = Object.keys(root.dependencies).sort()
          if (JSON.stringify(publicNames) !== JSON.stringify(rootNames)) {
            throw new Error(`root dependencies ${rootNames} do not match public packages ${publicNames}`)
          }
          for (const [name, version] of Object.entries(root.dependencies)) {
            if (version !== root.version) {
              throw new Error(`${name}: ${version} must equal ${root.version}`)
            }
          }

          const namePattern = /^@srmico\/dsh-tinfoil(?:-[a-z0-9]+(?:-[a-z0-9]+)*)?$/
          if (!namePattern.test(root.name)) throw new Error(`invalid root name ${root.name}`)
          if (root.publishConfig?.access !== 'public') throw new Error('root must publish publicly')
          if (!Array.isArray(root.files) || !root.files.includes('LICENSE')) {
            throw new Error('root files must include LICENSE')
          }
          if (!fs.existsSync('LICENSE')) throw new Error('root LICENSE is missing')
          if (!fs.existsSync(root.dsh?.bundle?.patch ?? '')) throw new Error('root bundle patch is missing')

          for (const { dir, manifest } of publicPackages) {
            if (!namePattern.test(manifest.name)) throw new Error(`invalid package name ${manifest.name}`)
            for (const section of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
              if (manifest[section]?.['@srmico/dsh-tinfoil-lib']) {
                throw new Error(`${manifest.name} has the private lib in ${section}`)
              }
            }
            if (manifest.publishConfig?.access !== 'public') {
              throw new Error(`${manifest.name} must publish publicly`)
            }
            if (!Array.isArray(manifest.files) || !manifest.files.includes('LICENSE')) {
              throw new Error(`${manifest.name} files must include LICENSE`)
            }
            if (!fs.existsSync(`packages/${dir}/LICENSE`)) {
              throw new Error(`${manifest.name} LICENSE is missing`)
            }
            const patch = manifest.dsh?.bundle?.patch
            if (typeof patch !== 'string' || !fs.existsSync(`packages/${dir}/${patch}`)) {
              throw new Error(`${manifest.name} bundle patch is missing`)
            }
          }

          console.log(`release ${tag}: ${publicPackages.length + 1} publishable packages, layout verified`)
          NODE

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Pack release tarballs
        run: |
          rm -rf dist
          mkdir -p dist
          packages=(
            packages/dsh-tinfoil-audio
            packages/dsh-tinfoil-decisions
            packages/dsh-tinfoil-documents
            packages/dsh-tinfoil-pii
            packages/dsh-tinfoil-provider
            packages/dsh-tinfoil-verification
            packages/dsh-tinfoil-web
            .
          )
          for dir in "${packages[@]}"; do
            pnpm --dir "$dir" pack --pack-destination "$PWD/dist"
          done
          test "$(ls dist/*.tgz | wc -l)" -eq 8
          (cd dist && sha256sum *.tgz > SHA256SUMS)
          ls -l dist

      - name: Validate packed manifests
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')
          const tarballs = fs.readdirSync('dist').filter((name) => name.endsWith('.tgz'))
          for (const file of tarballs) {
            const manifest = JSON.parse(execFileSync('tar', ['-xOzf', `dist/${file}`, 'package/package.json'], { encoding: 'utf8' }))
            const files = execFileSync('tar', ['-tzf', `dist/${file}`], { encoding: 'utf8' }).split('\n').filter(Boolean)
            if (!files.includes('package/LICENSE')) {
              throw new Error(`${manifest.name}: packed tarball is missing LICENSE`)
            }
            const forbidden = files.filter((path) => {
              if (path.startsWith('package/src/') || path.startsWith('package/node_modules/')) return true
              if (path.endsWith('.map')) return true
              const name = path.slice('package/'.length)
              return /^tsconfig.*\.json$/.test(name) || /^tsdown\.config\./.test(name)
            })
            if (forbidden.length > 0) {
              throw new Error(`${manifest.name}: packed tarball contains ${forbidden.join(', ')}`)
            }
            if (JSON.stringify(manifest).includes('workspace:')) {
              throw new Error(`${manifest.name}: packed manifest contains a workspace protocol`)
            }
            for (const section of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
              if (manifest[section]?.['@srmico/dsh-tinfoil-lib']) {
                throw new Error(`${manifest.name}: packed manifest has the private lib in ${section}`)
              }
            }
          }
          console.log(`validated ${tarballs.length} packed manifests`)
          NODE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-tinfoil-npm-tarballs
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ''
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dsh-tinfoil-npm-tarballs
          path: dist

      - name: Isolate npm configuration
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/npm/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npm/npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_UPDATE_NOTIFIER=false" >> "$GITHUB_ENV"

      - name: Require npm with OIDC support
        run: |
          node - "$(npm --version)" <<'NODE'
          const [major, minor] = process.argv[2].split('.').map(Number)
          if (major < 11 || (major === 11 && minor < 5)) {
            console.error(`npm ${process.argv[2]} is too old for Trusted Publishing; require >=11.5.1`)
            process.exit(1)
          }
          NODE

      - name: Compute npm dist-tag
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-alpha.*) tag=alpha ;;
            *-canary.*) tag=canary ;;
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          echo "DIST_TAG=$tag" >> "$GITHUB_ENV"

      - name: Publish tarballs
        run: |
          packages=(
            packages/dsh-tinfoil-audio
            packages/dsh-tinfoil-decisions
            packages/dsh-tinfoil-documents
            packages/dsh-tinfoil-pii
            packages/dsh-tinfoil-provider
            packages/dsh-tinfoil-verification
            packages/dsh-tinfoil-web
            .
          )
          for dir in "${packages[@]}"; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view --prefer-online "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
              continue
            fi
            base="${name#@}"
            file="dist/${base//\//-}-$version.tgz"
            npm publish "$file" --tag "$DIST_TAG" --provenance --ignore-scripts
          done

  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dsh-tinfoil-npm-tarballs
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tgz dist/SHA256SUMS --clobber
            exit 0
          fi
          args=(--verify-tag --title "dsh-tinfoil $RELEASE_TAG" --generate-notes)
          case "$RELEASE_TAG" in
            *-*) args+=(--prerelease) ;;
            *) args+=(--latest) ;;
          esac
          gh release create "$RELEASE_TAG" dist/*.tgz dist/SHA256SUMS "${args[@]}"
